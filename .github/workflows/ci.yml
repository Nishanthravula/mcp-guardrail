name: CI
on:
  push:
    branches: [main]
  pull_request:

# onnxruntime-node (an optional dev dependency) would otherwise download GPU
# libraries on install; its CPU build is bundled and is all the tests need.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Guard against the test glob silently matching nothing.
      - run: test "$(ls tests/*.test.ts | wc -l)" -gt 0
      - name: Unit, regression and ReDoS tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
      - name: End-to-end tests (real MCP server)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      - name: Release checks (no dependencies, model size, documented numbers match results)
        run: npm run check:release
      - name: Show failing tests on the run summary
        if: failure()
        run: |
          grep -h -E -A8 "^not ok|^✖|^\s+✖" unit.log e2e.log 2>/dev/null | head -80 | sed 's/^/::error::/' || true

  ml:
    # Training, export and evaluation code, including the transformer pipeline
    # on a tiny CPU model. Does not download datasets or pretrained models.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ml/requirements.txt -r ml/requirements-encoder.txt
      - run: python -m pytest ml -q
      - name: The committed tiny test model is reproducible
        run: |
          python -m ml.encoder.make_fixture --out /tmp/encoder-tiny
          python - <<'PY'
          import json
          a = json.load(open("tests/fixtures/encoder-tiny/golden.json"))["cases"]
          b = json.load(open("/tmp/encoder-tiny/golden.json"))["cases"]
          assert [c["ids"] for c in a] == [c["ids"] for c in b], "token ids differ"
          worst = max(abs(x["score"] - y["score"]) for x, y in zip(a, b))
          assert worst < 1e-3, f"scores differ by {worst}"
          print("fixture reproduced; largest score difference", worst)
          PY
